<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Central de Recrutamento — Billie Global BR</title>
  <style>
    :root {
      --red: #e50914;
      --dark: #0a0a0a;
      --card: #141414;
      --border: #2a2a2a;
      --text: #e5e5e5;
      --muted: #808080;
      --green: #2ecc71;
      --yellow: #f39c12;
      --blue: #3498db;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--dark); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

    /* Header */
    .header {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0a0a 100%);
      border-bottom: 2px solid var(--red);
      padding: 20px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-logo { display: flex; align-items: center; gap: 15px; }
    .header-logo h1 { font-size: 22px; font-weight: 800; }
    .header-logo h1 span { color: var(--red); }
    .header-badge {
      background: var(--red);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .header-refresh {
      background: var(--border);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .header-refresh:hover { background: var(--red); border-color: var(--red); }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      padding: 25px 30px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      transition: transform 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-card .num { font-size: 36px; font-weight: 900; margin-bottom: 5px; }
    .stat-card .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .stat-card.total .num { color: var(--blue); }
    .stat-card.aprovados .num { color: var(--green); }
    .stat-card.reprovados .num { color: var(--red); }
    .stat-card.andamento .num { color: var(--yellow); }
    .stat-card.score .num { color: #e91e8c; }

    /* Filtros */
    .filtros {
      padding: 0 30px 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filtro-btn {
      padding: 7px 18px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .filtro-btn:hover, .filtro-btn.ativo { background: var(--red); border-color: var(--red); color: white; }
    .search-box {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 13px;
      width: 200px;
      outline: none;
    }
    .search-box:focus { border-color: var(--red); }

    /* Tabela */
    .table-container { padding: 0 30px 30px; overflow-x: auto; }
    .candidatos-count { font-size: 13px; color: var(--muted); margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: #1a1a1a; }
    th { padding: 12px 15px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); }
    td { padding: 14px 15px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
    tr:hover td { background: rgba(229, 9, 20, 0.05); }

    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .status-finalizado { background: rgba(46, 204, 113, 0.15); color: var(--green); border: 1px solid var(--green); }
    .status-reprovado { background: rgba(229, 9, 20, 0.15); color: var(--red); border: 1px solid var(--red); }
    .status-em_andamento { background: rgba(243, 156, 18, 0.15); color: var(--yellow); border: 1px solid var(--yellow); }

    .score-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .score-bar .bar {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .score-bar .fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
    .score-num { font-size: 12px; font-weight: 700; min-width: 30px; }

    .ver-btn {
      background: var(--border);
      color: var(--text);
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .ver-btn:hover { background: var(--red); color: white; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }
    .modal-overlay.ativo { display: flex; align-items: flex-start; justify-content: center; }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 750px;
      margin: auto;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header {
      padding: 25px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h2 { font-size: 20px; }
    .modal-close {
      background: var(--border);
      border: none;
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close:hover { background: var(--red); }
    .modal-body { padding: 25px; }

    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
    .info-item { background: #1a1a1a; border-radius: 10px; padding: 15px; }
    .info-item .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
    .info-item .value { font-size: 14px; font-weight: 600; }

    .ia-avaliacao {
      background: linear-gradient(135deg, #1a0a1a, #0a1a0a);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .ia-avaliacao h3 { font-size: 14px; color: #e91e8c; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .ia-avaliacao p { font-size: 13px; color: var(--text); line-height: 1.6; }

    .respostas-section h3 { font-size: 14px; color: var(--muted); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
    .resposta-item { margin-bottom: 20px; }
    .resposta-item .pergunta { font-size: 12px; color: var(--red); font-weight: 700; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
    .resposta-item .resposta { font-size: 13px; color: var(--text); line-height: 1.6; background: #1a1a1a; padding: 12px 15px; border-radius: 8px; border-left: 3px solid var(--border); }
    .resposta-item .resposta.resposta-boa { border-left-color: var(--green); }

    /* Score grande */
    .score-grande {
      text-align: center;
      padding: 20px;
      margin-bottom: 20px;
    }
    .score-grande .numero {
      font-size: 64px;
      font-weight: 900;
      line-height: 1;
    }
    .score-grande .label { font-size: 13px; color: var(--muted); margin-top: 5px; }
    .score-grande .barra-grande {
      width: 100%;
      height: 10px;
      background: var(--border);
      border-radius: 5px;
      overflow: hidden;
      margin-top: 15px;
    }

    /* Empty state */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 48px; margin-bottom: 15px; }
    .empty-state p { font-size: 15px; }

    /* Loading */
    .loading { text-align: center; padding: 60px; color: var(--muted); }
    .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsivo */
    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .header { padding: 15px; }
      .stats-grid, .filtros, .table-container { padding-left: 15px; padding-right: 15px; }
      .info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-logo">
    <div>
      <h1>🔴 <span>Billie Global BR</span></h1>
      <div style="font-size:12px;color:var(--muted);margin-top:3px">Central de Recrutamento de Administradores</div>
    </div>
    <span class="header-badge">Admin</span>
  </div>
  <button class="header-refresh" onclick="carregarDados()">🔄 Atualizar</button>
</div>

<!-- Stats -->
<div class="stats-grid" id="stats-container">
  <div class="stat-card total"><div class="num" id="stat-total">—</div><div class="label">Total</div></div>
  <div class="stat-card aprovados"><div class="num" id="stat-aprovados">—</div><div class="label">Aprovados</div></div>
  <div class="stat-card reprovados"><div class="num" id="stat-reprovados">—</div><div class="label">Reprovados</div></div>
  <div class="stat-card andamento"><div class="num" id="stat-andamento">—</div><div class="label">Em andamento</div></div>
  <div class="stat-card score"><div class="num" id="stat-score">—</div><div class="label">Score médio</div></div>
</div>

<!-- Filtros -->
<div class="filtros">
  <button class="filtro-btn ativo" onclick="filtrar('todos', this)">Todos</button>
  <button class="filtro-btn" onclick="filtrar('finalizado', this)">✅ Aprovados</button>
  <button class="filtro-btn" onclick="filtrar('reprovado', this)">❌ Reprovados</button>
  <button class="filtro-btn" onclick="filtrar('em_andamento', this)">⏳ Em andamento</button>
  <input class="search-box" type="text" placeholder="🔍 Buscar por nome..." id="search-input" oninput="filtrarBusca()"/>
</div>

<!-- Tabela -->
<div class="table-container">
  <div class="candidatos-count" id="count-label"></div>
  <div id="tabela-container">
    <div class="loading"><div class="spinner"></div><br>Carregando candidaturas...</div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="fecharModal(event)">
  <div class="modal" id="modal-content"></div>
</div>

<script>
  let todosCandidatos = [];
  let filtroAtivo = 'todos';

  const API_BASE = window.location.origin;

  async function carregarDados() {
    try {
      // Stats
      const statsRes = await fetch(API_BASE + '/api/stats');
      const stats = await statsRes.json();
      document.getElementById('stat-total').textContent = stats.total || 0;
      document.getElementById('stat-aprovados').textContent = stats.finalizados || 0;
      document.getElementById('stat-reprovados').textContent = stats.reprovados || 0;
      document.getElementById('stat-andamento').textContent = stats.em_andamento || 0;
      document.getElementById('stat-score').textContent = Math.round(stats.media_score || 0);

      // Candidatos
      const res = await fetch(API_BASE + '/api/candidatos');
      todosCandidatos = await res.json();
      renderTabela(todosCandidatos);
    } catch (e) {
      document.getElementById('tabela-container').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>Erro ao carregar dados.<br>Verifique se o servidor está online.</p></div>';
    }
  }

  function filtrar(status, btn) {
    filtroAtivo = status;
    document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('ativo'));
    btn.classList.add('ativo');
    filtrarBusca();
  }

  function filtrarBusca() {
    const busca = document.getElementById('search-input').value.toLowerCase();
    let lista = todosCandidatos;
    if (filtroAtivo !== 'todos') lista = lista.filter(c => c.status === filtroAtivo);
    if (busca) lista = lista.filter(c => (c.nome || '').toLowerCase().includes(busca) || c.numero.includes(busca));
    renderTabela(lista);
  }

  function renderTabela(lista) {
    document.getElementById('count-label').textContent = lista.length + ' candidato(s) encontrado(s)';

    if (!lista.length) {
      document.getElementById('tabela-container').innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>Nenhuma candidatura encontrada.</p></div>';
      return;
    }

    let html = `<table>
      <thead>
        <tr>
          <th>#</th>
          <th>Nome</th>
          <th>Número</th>
          <th>Status</th>
          <th>Score IA</th>
          <th>Etapa</th>
          <th>Data</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>`;

    lista.forEach(function(c, i) {
      const score = c.score_ia || 0;
      const scoreColor = score >= 70 ? '#2ecc71' : score >= 50 ? '#f39c12' : '#e50914';
      const statusClass = 'status-' + c.status;
      const statusLabel = c.status === 'finalizado' ? '✅ Aprovado' : c.status === 'reprovado' ? '❌ Reprovado' : '⏳ Em andamento';
      const data = c.iniciado_em ? c.iniciado_em.slice(0, 16).replace('T', ' ') : '—';
      const etapa = c.status === 'em_andamento' ? (c.etapa - 1) + '/16' : '—';

      html += `<tr>
        <td style="color:var(--muted)">${i + 1}</td>
        <td><strong>${c.nome || '(sem nome)'}</strong></td>
        <td style="font-family:monospace;color:var(--muted)">${c.numero}</td>
        <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
        <td>
          ${c.status !== 'em_andamento' ? `
          <div class="score-bar">
            <div class="bar"><div class="fill" style="width:${score}%;background:${scoreColor}"></div></div>
            <span class="score-num" style="color:${scoreColor}">${score}</span>
          </div>` : '<span style="color:var(--muted)">—</span>'}
        </td>
        <td style="color:var(--muted)">${etapa}</td>
        <td style="color:var(--muted);font-size:12px">${data}</td>
        <td><button class="ver-btn" onclick='verCandidato(${JSON.stringify(c).replace(/'/g, "\\'")})'>Ver</button></td>
      </tr>`;
    });

    html += '</tbody></table>';
    document.getElementById('tabela-container').innerHTML = html;
  }

  function verCandidato(c) {
    const score = c.score_ia || 0;
    const scoreColor = score >= 70 ? '#2ecc71' : score >= 50 ? '#f39c12' : '#e50914';
    const statusLabel = c.status === 'finalizado' ? '✅ Aprovado' : c.status === 'reprovado' ? '❌ Reprovado' : '⏳ Em andamento';

    const perguntas = [
      ['Interesse na vaga', c.r_interesse],
      ['Experiência anterior', c.r_experiencia],
      ['Edição de imagens/vídeos', c.r_edicao],
      ['Legenda para Story', c.r_legenda_story],
      ['Legenda para Feed', c.r_legenda_feed],
      ['Como postaria um rumor', c.r_legenda_rumor],
      ['Comportamento social', c.r_comportamento],
      ['Horários disponíveis', c.r_horarios],
      ['WhatsApp', c.r_whatsapp],
      ['Instagram', c.r_instagram],
      ['Intenções', c.r_intencoes],
      ['Conhecimento sobre a Billie', c.r_conhecimento_billie],
      ['Nível de inglês', c.r_idiomas],
      ['Situação atual', c.r_situacao],
      ['Compromisso', c.r_compromisso],
      ['Aceitou os termos', c.r_termo],
    ];

    const respostasHtml = perguntas.map(function(p) {
      if (!p[1]) return '';
      return `<div class="resposta-item">
        <div class="pergunta">${p[0]}</div>
        <div class="resposta">${p[1].replace(/\n/g, '<br>')}</div>
      </div>`;
    }).join('');

    document.getElementById('modal-content').innerHTML = `
      <div class="modal-header">
        <div>
          <h2>${c.nome || '(sem nome)'}</h2>
          <div style="font-size:12px;color:var(--muted);margin-top:3px">${c.numero} · ${statusLabel}</div>
        </div>
        <button class="modal-close" onclick="fecharModal()">✕</button>
      </div>
      <div class="modal-body">

        ${c.status !== 'em_andamento' ? `
        <div class="score-grande">
          <div class="numero" style="color:${scoreColor}">${score}</div>
          <div class="label">Score da IA (0-100)</div>
          <div class="barra-grande"><div style="width:${score}%;height:100%;background:${scoreColor};border-radius:5px;transition:width 1s"></div></div>
        </div>` : ''}

        <div class="info-grid">
          <div class="info-item"><div class="label">Nome</div><div class="value">${c.nome || '—'}</div></div>
          <div class="info-item"><div class="label">WhatsApp</div><div class="value">${c.r_whatsapp || c.numero}</div></div>
          <div class="info-item"><div class="label">Instagram</div><div class="value">${c.r_instagram || '—'}</div></div>
          <div class="info-item"><div class="label">Status</div><div class="value">${statusLabel}</div></div>
          <div class="info-item"><div class="label">Iniciado em</div><div class="value">${(c.iniciado_em || '').slice(0, 16).replace('T', ' ')}</div></div>
          <div class="info-item"><div class="label">Finalizado em</div><div class="value">${c.finalizado_em ? c.finalizado_em.slice(0, 16).replace('T', ' ') : '—'}</div></div>
        </div>

        ${c.avaliacao_ia ? `
        <div class="ia-avaliacao">
          <h3>🤖 Avaliação da IA Gemini</h3>
          <p>${c.avaliacao_ia.replace(/\n/g, '<br>')}</p>
        </div>` : ''}

        ${respostasHtml ? `
        <div class="respostas-section">
          <h3>📋 Respostas Completas</h3>
          ${respostasHtml}
        </div>` : '<p style="color:var(--muted);text-align:center">Candidatura em andamento...</p>'}

      </div>`;

    document.getElementById('modal-overlay').classList.add('ativo');
  }

  function fecharModal(e) {
    if (!e || e.target === document.getElementById('modal-overlay')) {
      document.getElementById('modal-overlay').classList.remove('ativo');
    }
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') fecharModal();
  });

  // Auto-refresh a cada 30 segundos
  carregarDados();
  setInterval(carregarDados, 30000);
</script>
</body>
</html>
